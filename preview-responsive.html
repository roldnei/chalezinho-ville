<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificação responsiva · DEV</title>
<style>body{margin:0;background:#ded7ce;font:14px system-ui;color:#30251d}header{padding:16px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}header label{display:flex;align-items:center;gap:8px}select{padding:8px}iframe{display:block;margin:0 auto 30px;background:white;border:1px solid #b4a798;width:390px;height:844px;max-width:100%}</style></head>
<body><header><strong>Verificação em desenvolvimento</strong><label>Largura<select id="width"><option value="390">Celular · 390 px</option><option value="768">Tablet · 768 px</option><option value="1280">Desktop · 1280 px</option></select></label><label>Página<select id="page"><option value="index.html">Home</option><option value="reservar.html">Reserva</option><option value="estadias-admin.html">PMS · Estadias completas</option></select></label></header><iframe title="Site em largura de celular" src="index.html"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px';frame.title='Site em largura de '+e.target.value+' pixels'};document.querySelector('#page').onchange=e=>frame.src=e.target.value;</script></body>
</html>
