<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Teste A/B celular · Chalezinho Ville</title><link rel="stylesheet" href="booking.css"><style>body{max-width:1100px;margin:auto;padding:24px}section{margin:24px 0;padding:20px;border:1px solid #d2c8b7;border-radius:16px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.table-scroll{overflow:auto}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:12px;max-width:100%}[role=status]{min-height:1.5em}.muted{color:#655f54}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="app-config.js?v=mobile-ab1" defer></script><script src="mobile-entry-admin.js?v=1" defer></script></head><body><a href="admin.html">← Administração</a><h1>Teste A/B no celular</h1><p id="status" role="status">Carregando…</p><button id="reload" type="button">Atualizar</button><main id="report"></main><section><h2>Vincular atendimento</h2><p>Use a referência recebida na mensagem do hóspede. Abrir o WhatsApp não confirma envio.</p><form id="outcome"><label>Referência<input name="reference" required pattern="MV-[A-Fa-f0-9]{12}" placeholder="MV-0123456789AB"></label><label>Resultado<select name="kind"><option value="request_received">Recebi pedido com chalé, datas e hóspedes</option><option value="reservation_confirmed">Reserva confirmada no PMS</option></select></label><label>ID da reserva no PMS<input name="reservation_id" placeholder="Obrigatório para reserva confirmada"></label><button>Registrar vínculo</button><p id="outcome-status" role="status"></p></form></section></body></html>
