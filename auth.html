<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#17130f"><title>Conta | Chalezinho Ville</title><link rel="stylesheet" href="styles.css?v=60"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"></head><body class="account-page">
<header class="detail-header"><a class="brand" href="index.html">Chalezinho <i>Ville</i></a><a class="back-home" href="reservar.html">← Reserva</a></header>
<main class="auth-shell"><section class="auth-card"><small>ÁREA DO HÓSPEDE · DESENVOLVIMENTO</small><h1>Sua conta,<br><em>sem complicação.</em></h1><div class="auth-tabs"><button data-auth-mode="login">Entrar</button><button data-auth-mode="signup">Criar conta</button></div><p id="auth-message" class="auth-message"></p>
<form id="pane-login"><div id="login-form"><label>E-mail<input id="login-email" type="email" autocomplete="email" required></label><label>Senha<input id="login-password" type="password" autocomplete="current-password" required></label><button class="primary-action" type="submit">Entrar</button><button type="button" class="text-action" data-auth-mode="recover">Esqueci minha senha</button></div></form>
<form id="pane-signup" hidden><div id="signup-form"><label>Nome completo<input id="signup-name" autocomplete="name" required></label><label>WhatsApp<input id="signup-phone" autocomplete="tel" required></label><label>E-mail<input id="signup-email" type="email" autocomplete="email" required></label><label>Senha<input id="signup-password" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary-action" type="submit">Criar conta</button></div></form>
<form id="pane-recover" hidden><div id="recover-form"><h2>Recuperar senha</h2><label>E-mail<input id="recover-email" type="email" autocomplete="email" required></label><button class="primary-action" type="submit">Enviar instruções</button><button type="button" class="text-action" data-auth-mode="login">Voltar</button></div></form>
<form id="pane-reset" hidden><div id="reset-form"><h2>Nova senha</h2><label>Nova senha<input id="reset-password" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary-action" type="submit">Salvar nova senha</button></div></form>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="auth.js"></script></body></html>
