<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificação de layout · DEV</title><style>body{margin:0;background:#302a25;color:white;font:16px system-ui}header{padding:18px;display:flex;gap:18px;flex-wrap:wrap}label{display:grid;gap:6px}select{padding:10px;font:inherit}iframe{display:block;width:390px;height:844px;max-width:100%;margin:auto;border:2px solid #c8a987;background:white}p{margin:0 18px 18px}</style></head><body><header><label>Página<select id="page"><option value="index.html">Home</option><option value="chale-premium.html">Ville Signature</option><option value="reservar.html">Reserva</option><option value="estadias-admin.html">Estadias completas no PMS</option><option value="experiencias-admin.html">Pacotes no PMS</option></select></label><label>Largura do conteúdo<select id="width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1366">1366 px</option></select></label></header><p>Conteúdo real em uma janela com largura definida. Esta verificação de layout não simula um aparelho físico ou seu navegador.</p><iframe title="Página em verificação" src="index.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#page').onchange=e=>frame.src=e.target.value;document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';</script></body></html>
